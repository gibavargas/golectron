name: CI

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
      - run: go test ./...
      - run: go run ./tools/cefresolve --json
        continue-on-error: true
      - run: go run ./tools/memaudit --root . --check-cef-layout ./bin
        continue-on-error: true
      - run: go run ./cmd/electron-go --check-parity
        continue-on-error: true
