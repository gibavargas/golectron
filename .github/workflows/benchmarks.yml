name: Benchmarks

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches:
      - main
      - benchmark-hello-gate
    paths:
      - ".github/workflows/benchmarks.yml"
      - "cmd/**"
      - "compat/fixtures/benchmark-hello/**"
      - "internal/**"
      - "native/**"
      - "tools/benchmarks/**"
      - "tools/fetch_cef.sh"
      - "go.mod"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/benchmarks.yml"
      - "cmd/**"
      - "compat/fixtures/benchmark-hello/**"
      - "internal/**"
      - "native/**"
      - "tools/benchmarks/**"
      - "tools/fetch_cef.sh"
      - "go.mod"

jobs:
  hello:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install browser runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libgtk-3-0 \
            libgdk-pixbuf2.0-0 \
            libglib2.0-0 \
            libnss3 \
            libnspr4 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libgbm1 \
            libasound2 \
            xvfb

      - name: Install official Electron baseline
        run: npm install --prefix /tmp/electron-go-bench electron@42.0.0

      - name: Fetch and stage CEF
        run: tools/fetch_cef.sh

      - name: Build Electron-Go CEF binary
        run: go build -tags electron_go_cef -o bin/electron-go ./cmd/electron-go

      - name: Warm benchmark commands
        run: |
          xvfb-run -a timeout 30 /tmp/electron-go-bench/node_modules/.bin/electron compat/fixtures/benchmark-hello
          xvfb-run -a timeout 30 bin/electron-go compat/fixtures/benchmark-hello

      - name: Compare hello startup against official Electron
        env:
          ELECTRON_GO_STARTUP_TRACE: "1"
        run: |
          mkdir -p benchmark-artifacts
          xvfb-run -a go run ./tools/benchmarks \
            --fixture ./compat/fixtures/benchmark-hello \
            --iterations 5 \
            --timeout 30s \
            --measure-rss \
            --measure-process-tree-rss \
            --output benchmark-artifacts/hello-linux.json \
            --electron /tmp/electron-go-bench/node_modules/.bin/electron \
            --electron-go bin/electron-go \
            --require-faster process_tree_rss_peak_median_kb

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hello-linux-benchmark
          path: benchmark-artifacts/hello-linux.json
