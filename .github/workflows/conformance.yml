name: Conformance

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches:
      - main
      - conformance-hello-gate
    paths:
      - ".github/workflows/conformance.yml"
      - "cmd/**"
      - "compat/**"
      - "internal/**"
      - "native/**"
      - "tools/fetch_cef.sh"
      - "go.mod"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/conformance.yml"
      - "cmd/**"
      - "compat/**"
      - "internal/**"
      - "native/**"
      - "tools/fetch_cef.sh"
      - "go.mod"

jobs:
  hello:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install browser runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libgtk-3-0 \
            libgdk-pixbuf2.0-0 \
            libglib2.0-0 \
            libnss3 \
            libnspr4 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libgbm1 \
            libasound2 \
            xvfb

      - name: Install official Electron baseline
        run: npm install --prefix /tmp/electron-go-conformance electron@42.0.0

      - name: Fetch and stage CEF
        run: tools/fetch_cef.sh

      - name: Build Electron-Go CEF binary
        run: go build -tags electron_go_cef -o bin/electron-go ./cmd/electron-go

      - name: Run official Electron hello fixture
        run: xvfb-run -a timeout 30 /tmp/electron-go-conformance/node_modules/.bin/electron compat/fixtures/benchmark-hello

      - name: Run Electron-Go hello fixture
        run: xvfb-run -a timeout 30 bin/electron-go compat/fixtures/benchmark-hello

      - name: Probe opt-in scoped main runner
        if: github.event_name == 'workflow_dispatch'
        env:
          ELECTRON_GO_ENABLE_SCOPED_MAIN_RUNNER: "1"
          ELECTRON_GO_BENCHMARK_TRACE: "1"
          ELECTRON_GO_STARTUP_TRACE: "1"
        run: |
          mkdir -p scoped-runner-artifacts
          set +e
          xvfb-run -a timeout 30 bin/electron-go compat/fixtures/benchmark-hello > scoped-runner-artifacts/scoped-main-runner.log 2>&1
          status="$?"
          echo "${status}" > scoped-runner-artifacts/scoped-main-runner.status
          cat scoped-runner-artifacts/scoped-main-runner.log
          exit "${status}"

      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch'
        with:
          name: scoped-main-runner-probe
          path: scoped-runner-artifacts/*

      - name: Run scoped benchmark fixture conformance gate
        if: github.event_name == 'workflow_dispatch'
        env:
          ELECTRON_BIN: /tmp/electron-go-conformance/node_modules/.bin/electron
          ELECTRON_GO_BIN: ${{ github.workspace }}/bin/electron-go
          ELECTRON_GO_ENABLE_RUNTIME_FIXTURE_CONFORMANCE: "1"
          ELECTRON_GO_ENABLE_SCOPED_MAIN_RUNNER: "1"
          ELECTRON_GO_BENCHMARK_TRACE: "1"
        run: xvfb-run -a go test ./compat -run TestBenchmarkHelloFixtureConformance -count=1 -v

      - name: Verify Electron-Go runtime process model
        run: xvfb-run -a timeout 30 bin/electron-go --process-model-check compat/fixtures/benchmark-hello

      - name: Run Go conformance suite against both binaries
        run: |
          xvfb-run -a env \
            ELECTRON_BIN=/tmp/electron-go-conformance/node_modules/.bin/electron \
            ELECTRON_GO_BIN="${GITHUB_WORKSPACE}/bin/electron-go" \
            go test ./compat
