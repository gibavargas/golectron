name: Conformance

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches:
      - main
      - conformance-hello-gate
    paths:
      - ".github/workflows/conformance.yml"
      - "cmd/**"
      - "compat/**"
      - "internal/**"
      - "native/**"
      - "tools/fetch_cef.sh"
      - "go.mod"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/conformance.yml"
      - "cmd/**"
      - "compat/**"
      - "internal/**"
      - "native/**"
      - "tools/fetch_cef.sh"
      - "go.mod"

jobs:
  hello:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install browser runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libgtk-3-0 \
            libgdk-pixbuf2.0-0 \
            libglib2.0-0 \
            libnss3 \
            libnspr4 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libgbm1 \
            libasound2 \
            xvfb

      - name: Install official Electron baseline
        run: npm install --prefix /tmp/electron-go-conformance electron@42.0.0

      - name: Fetch and stage CEF
        run: tools/fetch_cef.sh

      - name: Build Electron-Go CEF binary
        run: go build -tags electron_go_cef -o bin/electron-go ./cmd/electron-go

      - name: Run official Electron hello fixture
        run: xvfb-run -a timeout 30 /tmp/electron-go-conformance/node_modules/.bin/electron compat/fixtures/benchmark-hello

      - name: Run Electron-Go hello fixture
        run: xvfb-run -a timeout 30 bin/electron-go compat/fixtures/benchmark-hello

      - name: Run Go conformance suite against both binaries
        run: |
          xvfb-run -a env \
            ELECTRON_BIN=/tmp/electron-go-conformance/node_modules/.bin/electron \
            ELECTRON_GO_BIN="${GITHUB_WORKSPACE}/bin/electron-go" \
            go test ./compat
