name: CEF Bootstrap

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/cef_bootstrap.yml"
      - "cmd/**"
      - "compat/**"
      - "internal/**"
      - "native/**"
      - "tools/**"
      - "go.mod"
      - "Makefile"

jobs:
  cef-bootstrap:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"

      - name: Install CEF system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libgtk-3-0 \
            libgdk-pixbuf2.0-0 \
            libglib2.0-0 \
            libnss3 \
            libnss3-tools \
            libnspr4 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libgbm1 \
            libasound2 \
            xvfb

      - name: Resolve exact CEF artifact
        run: go run ./tools/cefresolve --json

      - name: Fetch and stage CEF
        run: tools/fetch_cef.sh

      - name: Verify staged CEF library
        run: test -f bin/libcef.so

      - name: Build CEF-linked binary
        run: go build -tags electron_go_cef -o bin/electron-go ./cmd/electron-go

      - name: Verify libcef linkage
        run: ldd bin/electron-go | grep "libcef.so => .*bin/libcef.so"

      - name: Verify CEF initialize
        run: xvfb-run -a bin/electron-go --cef-init-check

      - name: Verify BrowserWindow opens hello fixture
        run: xvfb-run -a timeout 20 bin/electron-go --hello

      - name: Verify BrowserWindow closes without zombie subprocesses
        run: |
          xvfb-run -a bash -c '
            timeout 20 bin/electron-go --hello
            sleep 1
            zombies="$(pgrep -a electron-go | wc -l)"
            test "${zombies}" -eq 0
          '

      - name: Verify runtime process model
        run: xvfb-run -a timeout 30 bin/electron-go --process-model-check compat/fixtures/benchmark-hello

      - name: Report parity gate
        run: bin/electron-go --check-parity || true
